<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Elegant Merchandise Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --mocha: #3B2F2F;
            --orange: #FF9F45;
            --pink: #FFC0CB;
            --line-color: rgba(0, 0, 0, 0.1);
        }

        body {
            background: linear-gradient(135deg, var(--orange), var(--pink));
            color: var(--mocha);
            font-family: 'Playfair Display', serif;
            line-height: 1.6;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contact-container {
            width: 80%;
            max-width: 800px;
            padding: 2rem;
            text-align: left;
        }

        /* Elegant Line */
        .elegant-line {
            position: relative;
            width: 100%;
            height: 4px;
            background: linear-gradient(135deg, var(--mocha), var(--pink));
            border-radius: 10px;
            margin: 3rem 0;
        }

        /* Curved Line */
        .curved-line {
            position: relative;
            width: 100%;
            height: 4px;
            background: var(--line-color);
            top: -15px;
            left: 0;
            border-radius: 10px;
            display: block;
            margin: 2rem auto;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding: 2rem 0;
        }

        .phone-number {
            font-size: 1.5rem;
            color: var(--mocha);
            margin-bottom: 1rem;
            text-align: center;
        }

        .email-address {
            color: white;
            text-align: center;
            margin-bottom: 2rem;
        }

        .contact-form {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--line-color);
            border-radius: 5px;
            font-size: 1rem;
        }

        .submit-button {
            background: linear-gradient(135deg, var(--orange), var(--mocha));
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }

        .submit-button:hover {
            transform: scale(1.05);
        }

        .contact-footer {
            text-align: center;
            padding-top: 2rem;
            color: var(--mocha);
        }

        @media (max-width: 768px) {
            .phone-number,
            .email-address {
                text-align: left;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="contact-container">
        <div class="contact-header">
            <h1>Good Vibez</h1>
            <h2> Contact Us</h2>
            <p>Connect with us for inquiries about our products, customer service, or order issues</p>
        </div>

        <div class="curved-line"></div>

        <div class="phone-number">Phone: (941) 404-8345</div>
        <div class="email-address">Email: webmaster@goodvibez.life</div>

        <div class="contact-form">
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" placeholder="" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" placeholder="" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea rows="5" placeholder="" required></textarea>
                </div>

                <button type="submit" class="submit-button">Send Message</button>
            </form>
        </div>

        <div class="contact-footer">
            <p>For inquiries about returning items, please visit our <a href="#" style="color: var(--mocha); text-decoration: none;">FAQ</a> page.</p>
            <p>We typically respond within 24 hours during business hours.</p>
        </div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Add your form submission logic here
            alert('Thank you for reaching out! We will get back to you soon.');
            this.reset();
        });
    </script>
</body>
</html>
